<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Pipeline Stage Gradients -->
    <linearGradient id="stage1_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <linearGradient id="stage2_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="stage3_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="deal_card_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="crm_iso_glow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#crm_iso_glow)">
    <!-- 1. STAGE 1 PLATFORM: LEADS INTAKE (Left Column) -->
    <g transform="translate(60, 180)">
      <polygon points="70,10 140,50 70,90 0,50" fill="url(#stage1_top)" stroke="#93C5FD" stroke-width="1.5" />
      <polygon points="0,50 70,90 70,120 0,80" fill="#CBD5E1" />
      <polygon points="70,90 140,50 140,80 70,120" fill="#94A3B8" />
      <text x="70" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E40AF">STAGE 01</text>
      <text x="70" y="62" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#64748B">QUALIFIED (24)</text>
    </g>

    <!-- 2. STAGE 2 PLATFORM: PIPELINE NEGOTIATION (Middle Column Elevated) -->
    <g transform="translate(220, 120)">
      <polygon points="80,10 160,55 80,100 0,55" fill="url(#stage2_top)" stroke="#60A5FA" stroke-width="1.5" />
      <polygon points="0,55 80,100 80,150 0,105" fill="#2563EB" />
      <polygon points="80,100 160,55 160,105 80,150" fill="#1D4ED8" />
      <text x="80" y="52" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">STAGE 02</text>
      <text x="80" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#EFF6FF">PROPOSAL ($185K)</text>
    </g>

    <!-- 3. STAGE 3 PLATFORM: REVENUE CLOSED / WON (Right Column Apex) -->
    <g transform="translate(400, 60)">
      <polygon points="70,10 140,50 70,90 0,50" fill="url(#stage3_top)" stroke="#38BDF8" stroke-width="1.5" />
      <polygon points="0,50 70,90 70,180 0,140" fill="#1E40AF" />
      <polygon points="70,90 140,50 140,140 70,180" fill="#1E1B4B" />
      <text x="70" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">CLOSED / WON</text>
      <text x="70" y="64" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#67E8F9">$480,000</text>
    </g>

    <!-- 4. ASCENDING CONVERSION TRAJECTORY VECTOR -->
    <path d="M 130 200 Q 280 120 450 70" stroke="#F43F5E" stroke-width="4" stroke-dasharray="6 4" fill="none" />
    <polygon points="458,66 446,62 444,76" fill="#F43F5E" />

    <!-- 5. FLOATING DEAL KANBAN CARD (In Transition) -->
    <g transform="translate(250, 60)">
      <polygon points="50,5 100,34 50,62 0,34" fill="url(#deal_card_grad)" stroke="#3B82F6" stroke-width="1.5" />
      <polygon points="0,34 50,62 50,70 0,42" fill="#94A3B8" />
      <polygon points="50,62 100,34 100,42 50,70" fill="#64748B" />
      <text x="50" y="32" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="800" fill="#1E293B">ENTERPRISE DEPLOY</text>
      <text x="50" y="44" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" font-weight="700" fill="#2563EB">$45,000 / YR</text>
    </g>
  </g>
</svg>
