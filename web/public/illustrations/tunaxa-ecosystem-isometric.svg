<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Isometric Grid & Floor Gradients -->
    <linearGradient id="iso_floor_grad" x1="400" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="iso_core_top" x1="320" y1="180" x2="480" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="iso_core_left" x1="320" y1="225" x2="400" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="iso_core_right" x1="400" y1="225" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Fiber Conduit Laser -->
    <linearGradient id="laser_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <filter id="iso_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. ISOMETRIC PERSPECTIVE BASE GRID -->
  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <!-- Isometric Grid Lines -->
    <line x1="400" y1="50" x2="100" y2="250" />
    <line x1="400" y1="50" x2="700" y2="250" />
    <line x1="100" y1="250" x2="400" y2="450" />
    <line x1="700" y1="250" x2="400" y2="450" />

    <line x1="250" y1="150" x2="550" y2="350" />
    <line x1="550" y1="150" x2="250" y2="350" />
    <line x1="400" y1="116" x2="400" y2="384" stroke-dasharray="4 4" />
  </g>

  <!-- 2. OPTICAL DATA CONDUITS LINKING SATELLITE NODES TO CORE -->
  <!-- Node 1: Workspace (Top-Left: 220, 140) -->
  <path d="M 220 170 L 360 215" stroke="url(#laser_blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />
  <!-- Node 2: CRM (Bottom-Left: 180, 310) -->
  <path d="M 210 320 L 360 275" stroke="url(#laser_blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />
  <!-- Node 3: Pass (Top-Right: 580, 140) -->
  <path d="M 580 170 L 440 215" stroke="url(#laser_blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />
  <!-- Node 4: Sign (Bottom-Right: 620, 310) -->
  <path d="M 590 320 L 440 275" stroke="url(#laser_blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />
  <!-- Node 5: Book (Top Center: 400, 90) -->
  <path d="M 400 120 L 400 180" stroke="url(#laser_blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />

  <!-- 3. CENTRAL TUNAXA ISOMETRIC PROCESSOR CORE -->
  <g filter="url(#iso_glow)">
    <!-- Base Plate -->
    <polygon points="400,230 480,275 400,320 320,275" fill="#0F172A" opacity="0.3" />

    <!-- Top Rhombus Face -->
    <polygon points="400,160 480,205 400,250 320,205" fill="url(#iso_core_top)" />
    <!-- Left Face -->
    <polygon points="320,205 400,250 400,310 320,265" fill="url(#iso_core_left)" />
    <!-- Right Face -->
    <polygon points="400,250 480,205 480,265 400,310" fill="url(#iso_core_right)" />

    <!-- Monogram Inset on Core -->
    <text x="400" y="215" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="2">TUNAXA</text>
    <text x="400" y="232" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#BFDBFE" letter-spacing="3">CORE v1.0</text>
  </g>

  <!-- 4. FLOATING SATELLITE APP NODES (ISOMETRIC PLATFORMS) -->

  <!-- NODE 1: AXA WORKSPACE (Top-Left) -->
  <g transform="translate(140, 110)">
    <polygon points="80,20 140,55 80,90 20,55" fill="url(#node_top)" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="20,55 80,90 80,105 20,70" fill="#CBD5E1" />
    <polygon points="80,90 140,55 140,70 80,105" fill="#94A3B8" />
    <!-- Mini App Monogram -->
    <circle cx="80" cy="55" r="14" fill="#3B82F6" />
    <text x="80" y="59" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">W</text>
    <text x="80" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E293B" letter-spacing="1">WORKSPACE</text>
  </g>

  <!-- NODE 2: AXA CRM (Bottom-Left) -->
  <g transform="translate(110, 270)">
    <polygon points="80,20 140,55 80,90 20,55" fill="url(#node_top)" stroke="#F43F5E" stroke-width="1.5" />
    <polygon points="20,55 80,90 80,105 20,70" fill="#CBD5E1" />
    <polygon points="80,90 140,55 140,70 80,105" fill="#94A3B8" />
    <circle cx="80" cy="55" r="14" fill="#2563EB" />
    <text x="80" y="59" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">CRM</text>
    <text x="80" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E293B" letter-spacing="1">PIPELINE</text>
  </g>

  <!-- NODE 3: AXA PASS (Top-Right) -->
  <g transform="translate(520, 110)">
    <polygon points="80,20 140,55 80,90 20,55" fill="url(#node_top)" stroke="#8B5CF6" stroke-width="1.5" />
    <polygon points="20,55 80,90 80,105 20,70" fill="#CBD5E1" />
    <polygon points="80,90 140,55 140,70 80,105" fill="#94A3B8" />
    <circle cx="80" cy="55" r="14" fill="#1E1B4B" />
    <text x="80" y="59" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#60A5FA">🔒</text>
    <text x="80" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E293B" letter-spacing="1">PASS VAULT</text>
  </g>

  <!-- NODE 4: AXA SIGN (Bottom-Right) -->
  <g transform="translate(540, 270)">
    <polygon points="80,20 140,55 80,90 20,55" fill="url(#node_top)" stroke="#F59E0B" stroke-width="1.5" />
    <polygon points="20,55 80,90 80,105 20,70" fill="#CBD5E1" />
    <polygon points="80,90 140,55 140,70 80,105" fill="#94A3B8" />
    <circle cx="80" cy="55" r="14" fill="#3B82F6" />
    <text x="80" y="59" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">✍</text>
    <text x="80" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E293B" letter-spacing="1">SIGN E-DOC</text>
  </g>

  <!-- NODE 5: AXA BOOK (Top Center) -->
  <g transform="translate(320, 20)">
    <polygon points="80,20 140,55 80,90 20,55" fill="url(#node_top)" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="20,55 80,90 80,105 20,70" fill="#CBD5E1" />
    <polygon points="80,90 140,55 140,70 80,105" fill="#94A3B8" />
    <circle cx="80" cy="55" r="14" fill="#2563EB" />
    <text x="80" y="59" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">⏱</text>
    <text x="80" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#1E293B" letter-spacing="1">CALENDAR</text>
  </g>
</svg>
