<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Isometric Board Gradients -->
    <linearGradient id="ws_panel_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="ws_chat_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="ws_drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ISOMETRIC BASE CANVAS (Main Document Editor Plane) -->
  <g filter="url(#ws_drop)">
    <!-- Shadow Base -->
    <polygon points="300,100 500,215 300,330 100,215" fill="#0F172A" opacity="0.08" transform="translate(0, 15)" />

    <!-- Main White Document Surface -->
    <polygon points="300,90 500,205 300,320 100,205" fill="url(#ws_panel_grad)" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Thickness -->
    <polygon points="100,205 300,320 300,332 100,217" fill="#94A3B8" />
    <polygon points="300,320 500,205 500,217 300,332" fill="#64748B" />

    <!-- Document Header Bar -->
    <polygon points="300,90 480,194 440,217 260,113" fill="#EFF6FF" />
    <text x="290" y="118" transform="rotate(30 290 118)" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#2563EB">/ AXA_WORKSPACE // DOC_V2.0</text>

    <!-- Simulated Isometric Code / Text Lines -->
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="200" y1="160" x2="340" y2="240" />
      <line x1="180" y1="180" x2="300" y2="250" />
      <line x1="160" y1="200" x2="380" y2="326" />
      <line x1="150" y1="225" x2="260" y2="288" />
    </g>

    <!-- Colored Syntax Highlight Block -->
    <polygon points="210,185 310,242 270,265 170,208" fill="#DBEAFE" />
    <line x1="185" y1="215" x2="280" y2="270" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />

    <!-- Real-time Collaborator Cursor 1 -->
    <g transform="translate(240, 190)">
      <polygon points="0,0 12,24 16,14 26,12" fill="#06B6D4" />
      <rect x="18" y="12" width="56" height="18" rx="4" fill="#06B6D4" />
      <text x="46" y="24" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">Alex (Sync)</text>
    </g>

    <!-- Real-time Collaborator Cursor 2 -->
    <g transform="translate(340, 240)">
      <polygon points="0,0 12,24 16,14 26,12" fill="#3B82F6" />
      <rect x="18" y="12" width="60" height="18" rx="4" fill="#3B82F6" />
      <text x="48" y="24" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">Sarah (Live)</text>
    </g>

    <!-- Floating Team Chat Bubble Card (Isometric Offset) -->
    <g transform="translate(360, 80)">
      <polygon points="80,10 160,55 80,100 0,55" fill="url(#ws_chat_grad)" stroke="#BFDBFE" stroke-width="1.5" />
      <polygon points="0,55 80,100 80,108 0,63" fill="#1D4ED8" />
      <polygon points="80,100 160,55 160,63 80,108" fill="#1E40AF" />
      <!-- Message Preview -->
      <circle cx="30" cy="50" r="10" fill="#FFFFFF" opacity="0.9" />
      <line x1="50" y1="48" x2="130" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="58" x2="110" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>
</svg>
