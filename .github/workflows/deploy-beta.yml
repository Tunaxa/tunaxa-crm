name: Deploy CRM Beta

on:
  push:
    branches:
      - dev

concurrency:
  group: crm-beta-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Beta Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Unified CRM Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tunaxa/tunaxa-crm:beta
            ghcr.io/tunaxa/tunaxa-crm:beta-${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/tunaxa-crm/beta
            export CRM_IMAGE=ghcr.io/tunaxa/tunaxa-crm:beta-${{ github.sha }}
            docker compose pull crm
            docker compose up -d postgres
            docker compose run --rm --no-deps crm node run-migrations.js
            docker compose up -d --no-deps crm
            docker image prune -f
