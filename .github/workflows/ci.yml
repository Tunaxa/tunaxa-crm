name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref so a force-push does not burn runner
# minutes re-running checks that are already obsolete. main is never cancelled
# so the post-merge signal on the default branch always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck, Lint, Migrate, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: monosie
          POSTGRES_DB: tunaxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: monosie
      PGDATABASE: tunaxa
      REDIS_URL: redis://localhost:6379
      REDIS_ENABLED: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Hard gate. Blocking.
      - name: Run Typecheck
        run: npm run typecheck

      # Hard gate. Blocking. Migrations are idempotent (IF NOT EXISTS /
      # OR REPLACE throughout), so re-running against the ephemeral service
      # container is safe.
      - name: Run Database Migrations
        run: npm run migrate

      # Advisory. The repository carries pre-existing lint errors, so this step
      # reports status without failing the job until that debt is cleared.
      # Removing continue-on-error makes lint a merge blocker again.
      - name: Run Linter
        continue-on-error: true
        run: npm run lint

      # Advisory. Same rationale as the lint step: the suite has known
      # pre-existing failures that are tracked separately. Drop
      # continue-on-error to make the suite a merge blocker.
      - name: Run Vitest Test Suite
        continue-on-error: true
        env:
          CI: true
          NODE_ENV: test
        run: npm test
