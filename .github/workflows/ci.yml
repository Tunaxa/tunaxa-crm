name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tunaxa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tunaxa2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tunaxa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: tunaxa
      PGUSER: postgres
      PGPASSWORD: tunaxa2024

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run database migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build